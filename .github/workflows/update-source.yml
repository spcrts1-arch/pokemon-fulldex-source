name: Update Fulldex source

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fulldex-source-sync
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check official releases and verify the iOS IPA
        env:
          GH_TOKEN: ${{ github.token }}
          ICON_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/icon.png
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--icon-url "$ICON_URL")
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--verify)
          fi
          python3 scripts/sync_source.py "${args[@]}"
      - name: Publish changes
        run: |
          git add -- source.json icon.png status.json
          if git diff --cached --quiet; then
            echo "The catalog is current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Pokémon Fulldex source'
          git push origin HEAD
